name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: cargo binstall diesel_cli
      - run: echo DATABASE_URL=postgres://postgres:postgres@localhost/test_postgres >> .env
      - run: echo TEST_DATABASE_URL=postgres://postgres:postgres@localhost/postgres >> .env
      - run: diesel setup
      - run: diesel migration run
      - run: cargo test
