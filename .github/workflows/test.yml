name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - run: cargo binstall diesel_cli
      - run: echo DATABASE_URL=postgres://postgres:postgres@localhost/test_postgres >> .env
      - run: echo TEST_DATABASE_URL=postgres://postgres:postgres@localhost/postgres >> .env
      - run: diesel --database-url postgres://postgres:postgres@localhost/postgres setup
      - run: diesel --database-url postgres://postgres:postgres@localhost/postgres migration run
      - run: cargo test
