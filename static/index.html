<html>
    <head>
        <title>Tasks</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        Task
        <form id="task-register-form">
            <label for="task-register-title">title</label>
            <input type="text" id="task-register-title" name="title"><br>
            <label for="task-register-description">description</label>
            <input type="text" id="task-register-description" name="description"><br>
            <label for="task-register-deadline">deadline</label>
            <input type="date" id="task-register-deadline" name="deadline"><br>
            <button type="submit">add</button>
        </form>
        <div id="notification-area"></div>
        <button onclick="showNotification('completed', 'info')">info</button>
        <button onclick="showNotification('error')", 'error'>Error</button>
        <ul id="task-list"></ul>
        <script src="index.js"></script>
    </body>
</html>
